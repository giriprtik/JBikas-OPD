version: '3.8'

services:
  auth-service:
    build: ./auth-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/jbikas_auth
    depends_on:
      - mysql-db

  opd-service:
    build: ./opd-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/jbikas_opd
    depends_on:
      - mysql-db

  lab-service:
    build: ./lab-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/jbikas_lab
    depends_on:
      - mysql-db

  frontend-ui:
    build: ./frontend-ui
    ports:
      - "5173:5173"

  mysql-db:
    image: mysql:8.0
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
    ports:
      - "3306:3306"
