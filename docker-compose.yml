services:
  postgres-db:
    image: postgres:15-alpine
    container_name: jbikas-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres  # Default fallback root database
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d # Mounts your database provisioning scripts
    networks:
      - jbikas-network

  auth-service:
    build: ./auth-service
    container_name: jbikas-auth-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/jbikas_auth
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password
      - JWT_SECRET=9a4f2c8d3e7b1a5f6c8d9e0a2b3c4d5e6f7g8h9i0j1k2l3m4n5o6p7q8r9s0t1u
      - JWT_EXPIRATION=86400000
    depends_on:
      - postgres-db
    networks:
      - jbikas-network

volumes:
  pgdata:

networks:
  jbikas-network:
    driver: bridge
