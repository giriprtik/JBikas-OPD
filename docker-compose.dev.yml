services:
  backend-test:
    image: maven:3.9.6-eclipse-temurin-17
    container_name: jbikas-backend-test
    volumes:
      - ./backend:/app
    working_dir: /app
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/jbikas_opd
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password
      - JWT_SECRET=9a4f2c8d3e7b1a5f6c8d9e0a2b3c4d5e6f7g8h9i0j1k2l3m4n5o6p7q8r9s0t1u
      - JWT_EXPIRATION=86400000
    depends_on:
      - postgres-db
    networks:
      - jbikas-network
