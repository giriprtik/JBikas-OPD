server:
  port: 8083

spring:
  application:
    name: lab-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres-db:5432/jbikas_lab}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    # Flyway (db/migration) owns the schema. Hibernate must not change it.
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: ${LAB_MAX_UPLOAD_SIZE:10MB}
      max-request-size: ${LAB_MAX_UPLOAD_SIZE:10MB}

jwt:
  secret: ${JWT_SECRET:9a4f2c8d3e7b1a5f6c8d9e0a2b3c4d5e6f7g8h9i0j1k2l3m4n5o6p7q8r9s0t1u}

opd:
  service:
    url: ${OPD_SERVICE_URL:http://opd-service:8082}

lab:
  attachments:
    # Mounted as a Docker volume (see docker-compose.yml). Back this up together with the database.
    dir: ${LAB_ATTACHMENTS_DIR:/data/lab-attachments}
  report:
    hospital-name: ${LAB_REPORT_HOSPITAL_NAME:JBikas Hospital}
    hospital-address: ${LAB_REPORT_HOSPITAL_ADDRESS:Department of Laboratory Medicine}

app:
  timezone: ${APP_TIMEZONE:Asia/Kathmandu}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
